name: Release

# Cuts a release from main: checks the version, creates the annotated tag, and
# publishes a GitHub release with the notes taken from CHANGELOG.md.
#
# Run it from Actions -> Release -> Run workflow, with the version to release.
# Packagist picks the new tag up through the repository webhook.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, with the leading v (for example v2.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest

    env:
      # Never interpolate a workflow input straight into a shell command;
      # going through the environment keeps it data rather than code.
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version is a semantic version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version tag such as v2.0.0."
            exit 1
          fi

      - name: Check the tag does not already exist
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION is already tagged. A published tag is never moved."
            exit 1
          fi

      # A tag whose number disagrees with the constant the library reports at
      # runtime is worse than no tag at all, so this is a hard failure.
      - name: Check the version matches Sms4FreeClient::VERSION
        run: |
          expected="${VERSION#v}"
          actual=$(grep -oP "VERSION = '\K[^']+" src/Sms4FreeClient.php)

          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Sms4FreeClient::VERSION is $actual but the tag would be $expected."
            exit 1
          fi

      - name: Take the release notes from the changelog
        run: |
          awk -v version="${VERSION#v}" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION#v}."
            exit 1
          fi

      - name: Create the tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git tag -a "$VERSION" -m "smsFreePHP $VERSION"
          git push origin "$VERSION"

      - name: Publish the release
        run: gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md
